<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidak ada sinyal — Seayoulatertrip</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/geo.css">
  <style>
    .offline-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--sand, #f7f1e6);
      text-align: center;
    }
    .offline-card {
      max-width: 26rem;
      background: #fff;
      border: 1px solid rgba(15, 64, 60, 0.15);
      border-radius: 1rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 12px 32px rgba(15, 64, 60, 0.12);
    }
    .offline-card h1 { font-size: 1.4rem; color: #0f4c47; margin-bottom: 0.5rem; }
    .offline-card p { font-size: 0.92rem; color: #4a5b58; margin-bottom: 0.9rem; }
    .offline-card ul { text-align: left; font-size: 0.86rem; color: #4a5b58; margin: 0 0 1.2rem 1.1rem; }
  </style>
</head>
<body>
  <main class="offline-wrap">
    <div class="offline-card">
      <h1>Tidak ada sinyal</h1>
      <p>Halaman ini membutuhkan koneksi internet. Jangan khawatir:</p>
      <ul>
        <li>Titik lokasi yang sudah direkam tetap tersimpan di perangkat.</li>
        <li>Begitu sinyal kembali, lokasi dikirim otomatis ke sistem kami.</li>
        <li>Booking dan pembayaran tidak terpengaruh.</li>
      </ul>
      <button type="button" class="btn btn--sunset" onclick="location.reload()">Coba muat ulang</button>
    </div>
  </main>
</body>
</html>
